<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3a6e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Patruno Monitor — Tesi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="config.js?v=2.0"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Patruno Monitor — Tesi <small style="font-size:.45em;opacity:.7">VERSIONE DEFINITIVA</small></h1>
      <p>HIIT + Forza · 14 settimane</p>
    </div>
    <div id="headerUser" class="headerUser hidden"></div>
  </header>
  <main>
    <section id="authView" class="authWrap">
      <div class="card authCard">
        <h2>Accedi</h2>
        <p class="muted">Ambiente separato dedicato alla tesi.</p>
        <form id="loginForm">
          <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
          <label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label>
          <button class="primary full" id="loginBtn" type="button">Accedi</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>
    <section id="appView" class="hidden">
      <nav id="tabs" class="tabs"></nav>
      <section id="view"></section>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=2.0"></script>
</body>
</html>
